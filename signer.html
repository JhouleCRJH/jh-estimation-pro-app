<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: https:; font-src data: https:; connect-src https://*.supabase.co http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'">
<title>Contrat à signer</title>
<style>
html,body{margin:0}
body{background:#EEF2F6;font:14px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#0F172A}
.jtop{background:#1A3A5C;color:#fff;padding:12px 18px}.jtop b{font-size:16px}.jtop span{opacity:.85;font-size:12.5px}
.jnote{max-width:820px;margin:12px auto 0;background:#fff;border:1px solid #CBD5E1;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#334155}
.jnote code{font-size:11.5px}.ok{color:#15803D;font-weight:600}.err{color:#B91C1C;font-weight:600}
.msg{max-width:640px;margin:40px auto;background:#fff;border:1px solid #CBD5E1;border-radius:12px;padding:22px 24px;font-size:15px}
.msg h1{font-size:19px;color:#1A3A5C;margin:0 0 8px}
#contrat{max-width:820px;margin:14px auto 0;background:#fff;border:1px solid #CBD5E1;border-radius:8px;padding:18px 22px;overflow-x:auto}
.jsign{max-width:820px;margin:14px auto 40px;background:#fff;border:2px solid #1A3A5C;border-radius:10px;padding:16px 20px}
.jsign h2{font-size:17px;font-weight:800;color:#1A3A5C;margin:0 0 10px;border:0}
.jsign label{display:block;margin:6px 0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.g3 label{font-size:12.5px;font-weight:600;color:#334155}
.jsign input[type=text],.jsign input[type=email],.jsign textarea{width:100%;box-sizing:border-box;border:1px solid #94A3B8;border-radius:6px;padding:7px 8px;font:14px "Segoe UI",Arial,sans-serif;color:#0F172A;background:#fff}
#pad{width:100%;height:170px;border:1px solid #64748B;border-radius:6px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.padbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#475569;margin-top:4px}
.bt{display:inline-block;border:1px solid #1A3A5C;background:#fff;color:#1A3A5C;border-radius:8px;padding:9px 16px;font:600 14px "Segoe UI",Arial,sans-serif;cursor:pointer;text-decoration:none;margin:8px 8px 0 0}
.bt.pri{background:#1A3A5C;color:#fff}.bt[disabled]{opacity:.6;cursor:wait}
.okb{background:#F0FDF4;border:1px solid #86EFAC;border-radius:8px;padding:10px 12px;margin-top:12px}
#sigprint{max-width:820px;margin:14px auto;background:#fff;border:1px solid #CBD5E1;border-radius:8px;padding:12px 22px}
@media (max-width:700px){.g3{grid-template-columns:1fr}#contrat,.jsign{margin-left:6px;margin-right:6px;padding:12px}}
@media print{.noprint,.jtop,.jnote{display:none!important}body{background:#fff}#contrat,#sigprint{border:0;margin:0;max-width:none}}
</style>
<style id="cssContrat"></style>
</head>
<body>
<div class="jtop" id="haut"><b>Contrat à signer</b></div>
<div class="msg" id="attente">Ouverture du contrat…</div>
<div class="jnote noprint" id="note" style="display:none"></div>
<div class="sheet" id="contrat" style="display:none"></div>
<div id="sigprint" style="display:none"></div>
<section class="jsign noprint" id="reponse" style="display:none">
  <h2>Votre réponse</h2>
  <label><input type="radio" name="dec" value="accepte"> J'accepte le contrat tel quel</label>
  <label><input type="radio" name="dec" value="modifs"> J'accepte le contrat avec les modifications suivantes</label>
  <div id="zmod" style="display:none"><textarea id="modifs" rows="3" placeholder="Décrivez les modifications demandées"></textarea></div>
  <label><input type="radio" name="dec" value="refuse"> Je refuse le contrat</label>
  <div id="zref" style="display:none"><textarea id="raison" rows="2" placeholder="Raison (facultatif)"></textarea></div>
  <div class="g3"><label>Nom<input type="text" id="nom" autocomplete="name"></label><label>Titre ou qualité<input type="text" id="titre" placeholder="ex. propriétaire"></label><label>Courriel<input type="email" id="courriel" autocomplete="email"></label></div>
  <div id="zsig">
    <label><input type="checkbox" id="lu"> J'ai lu le contrat et ses annexes et j'en accepte les conditions.</label>
    <canvas id="pad" aria-label="Zone de signature"></canvas>
    <div class="padbar"><span>Signez dans le cadre avec la souris ou le doigt.</span><button type="button" class="bt" id="effacer" style="margin:0;padding:4px 10px;font-size:12px">Effacer</button></div>
  </div>
  <div id="manque" class="err" style="margin-top:6px"></div>
  <button class="bt pri" type="button" id="signer">Signer et envoyer ma réponse</button>
  <div id="fin" style="display:none"></div>
</section>
<script>
/* JH Estimation Pro V93 — page publique de signature du contrat (24 nov. 2026).
   Ouverte depuis le lien du courriel (signer.html#j=<jeton>). Lit la demande par la fonction Supabase externe_lire (rôle anonyme,
   aucun accès à la table), montre le contrat, recueille la décision et la signature, puis l'envoie par externe_repondre (une seule
   réponse par lien). La réponse arrive seule dans le logiciel. Adresse et clé publique Supabase comme la page de connexion. */
(function () {
  'use strict';
  var PROD = { url: 'https://kupibvsswdxpgvnflmsd.supabase.co', cle: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cGlidnNzd2R4cGd2bmZsbXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0Mjk5MjgsImV4cCI6MjExMTAwNTkyOH0.JcSs4N_bbUe67kBpVVjHx3ALBzGeBTa99y8yTuCv8aU' };
  var BANC = location.protocol.indexOf('http') === 0 && /^(127\.0\.0\.1|localhost)$/.test(location.hostname) && !!window.JH92_BANC;
  var CFG = BANC ? { url: location.origin, cle: 'banc-cle-anon' } : PROD;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function message(titre, texte) { $('attente').style.display = ''; $('attente').innerHTML = '<h1>' + esc(titre) + '</h1><div>' + texte + '</div>'; ['note', 'contrat', 'reponse', 'sigprint'].forEach(function (i) { $(i).style.display = 'none'; }); }
  function jeton() { var m = /(?:^|[#&?])j=([0-9a-fA-F-]{36})/.exec(location.hash + '&' + location.search); return m ? m[1] : ''; }
  function rpc(nom, corps) {
    return fetch(CFG.url + '/rest/v1/rpc/' + nom, { method: 'POST', cache: 'no-store', headers: { apikey: CFG.cle, Authorization: 'Bearer ' + CFG.cle, 'Content-Type': 'application/json' }, body: JSON.stringify(corps) })
      .then(function (r) { return r.text().then(function (t) { var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { } if (!r.ok) { var x = new Error((j && (j.message || j.msg)) || ('erreur ' + r.status)); x.status = r.status; throw x; } return j; }); });
  }
  function hx(b) { var a = new Uint8Array(b), s = ''; for (var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2); return s; }
  function fnv(s) { var h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822507); } return ('0000000' + (h1 >>> 0).toString(16)).slice(-8) + ('0000000' + (h2 >>> 0).toString(16)).slice(-8); }
  function sha(s) { try { if (window.crypto && crypto.subtle) return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(hx); } catch (e) { } return Promise.resolve('fnv-' + fnv(s)); }
  /* le contrat vient du logiciel ; il est tout de même nettoyé (aucun script, aucun lien actif) avant d'être montré */
  function nettoyer(html) {
    var d = new DOMParser().parseFromString('<div id="r">' + String(html || '') + '</div>', 'text/html'); var r = d.getElementById('r'); if (!r) return '';
    Array.prototype.forEach.call(r.querySelectorAll('script,iframe,frame,frameset,object,embed,link,meta,base,form,noscript,template,style'), function (e) { e.remove(); });
    Array.prototype.forEach.call(r.querySelectorAll('*'), function (e) {
      Array.prototype.slice.call(e.attributes).forEach(function (a) {
        var n = a.name.toLowerCase(), v = String(a.value || '');
        if (n.indexOf('on') === 0 || n === 'formaction' || n === 'srcdoc') e.removeAttribute(a.name);
        else if ((n === 'href' || n === 'src' || n === 'xlink:href' || n === 'action' || n === 'background' || n === 'poster') && !/^(https:|data:image\/|#)/i.test(v.trim())) e.removeAttribute(a.name);
      });
      if (e.tagName === 'A') { e.setAttribute('target', '_blank'); e.setAttribute('rel', 'noopener noreferrer'); }
      if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.tagName)) e.setAttribute('disabled', '');
    });
    return r.innerHTML;
  }
  var cssPropre = function (c) { return String(c || '').replace(/@import[^;]*;?/gi, '').replace(/expression\s*\(/gi, '(').replace(/url\(\s*['"]?\s*(?!data:image\/)[^)]*\)/gi, 'none'); };

  var J = jeton(), C = null, EMP = '', trace = false;
  function demarrer() {
    if (!BANC && /__SB_/.test(PROD.url + PROD.cle)) { message('Page incomplète', 'Cette page n\'a pas l\'adresse du serveur. Communiquez avec l\'entreprise qui vous a envoyé le contrat.'); return; }
    if (!J) { message('Lien incomplet', 'L\'adresse de cette page doit se terminer par le code du lien reçu par courriel (après <b>#j=</b>). Ouvrez de nouveau le lien du courriel ou copiez l\'adresse au complet.'); return; }
    rpc('externe_lire', { p_jeton: J }).then(function (o) {
      if (!o || !o.ok) { refus(o || {}); return; }
      if (o.type !== 'signature') { message('Ce lien n\'est pas un contrat', 'Ce lien sert à un certificat de paiement : <a href="certificat.html#j=' + esc(J) + '">ouvrir le certificat de paiement</a>.'); return; }
      C = o.contenu || {}; montrer(o);
    }, function (e) { message('Connexion impossible', 'Le contrat n\'a pas pu être lu (' + esc(e.message || e) + '). Vérifiez votre connexion Internet, puis rechargez la page.'); });
  }
  function refus(o) {
    if (o.raison === 'repondu') message('Réponse déjà reçue', 'Votre réponse à ce contrat a déjà été reçue' + (o.repondu_le ? ' le ' + esc(new Date(o.repondu_le).toLocaleString('fr-CA')) : '') + '. Merci ! Pour la changer, communiquez avec l\'entreprise.');
    else if (o.raison === 'expire') message('Lien expiré', 'Ce lien a expiré' + (o.expire ? ' le ' + esc(new Date(o.expire).toLocaleDateString('fr-CA')) : '') + '. Demandez un nouveau lien à l\'entreprise qui vous a envoyé le contrat.');
    else if (o.raison === 'annule') message('Lien retiré', 'Ce lien a été retiré par l\'entreprise (un nouveau contrat vous a peut-être été envoyé). Communiquez avec elle au besoin.');
    else message('Lien non valide', 'Ce lien n\'est pas valide. Ouvrez de nouveau le lien du courriel ou copiez l\'adresse au complet ; sinon, demandez un nouveau lien à l\'entreprise.');
  }
  function montrer(o) {
    document.title = C.titre || 'Contrat à signer';
    $('haut').innerHTML = '<b>' + esc(C.entreprise || 'L\'entreprise') + '</b> vous envoie un contrat à signer<br><span>Projet ' + esc(C.projet || '') + ' · code ' + esc(C.code || '') + (C.envoyeLe ? ' · envoyé le ' + esc(C.envoyeLe) : '') + (o.expire ? ' · lien valide jusqu\'au ' + esc(new Date(o.expire).toLocaleDateString('fr-CA')) : '') + '</span>';
    $('cssContrat').textContent = cssPropre(C.css);
    $('contrat').innerHTML = nettoyer(C.contrat); $('contrat').style.display = '';
    $('note').innerHTML = 'Lisez le contrat ci-dessous, puis répondez et signez au bas de la page. Votre réponse est transmise directement à ' + esc(C.entreprise || 'l\'entreprise') + ' : aucun fichier à renvoyer. Empreinte du document : <code id="emp">…</code> <span id="empst"></span>';
    $('note').style.display = ''; $('attente').style.display = 'none'; $('reponse').style.display = '';
    sha(String(C.contrat || '')).then(function (h) { EMP = h; $('emp').textContent = h.slice(0, 20) + '…'; var ok = h === C.empreinte; $('empst').textContent = ok ? 'Document conforme à celui envoyé.' : 'Attention : ce document ne correspond pas à l\'empreinte envoyée.'; $('empst').className = ok ? 'ok' : 'err'; }, function () { EMP = 'fnv-' + fnv(String(C.contrat || '')); });
    $('nom').value = (C.dest && C.dest.nom) || ''; $('courriel').value = (C.dest && C.dest.courriel) || '';
    pad();
  }
  var cv, ctx;
  function pad() {
    cv = $('pad'); ctx = cv.getContext('2d'); var down = false;
    function taille() { var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, img = trace ? cv.toDataURL() : null; cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0F172A'; if (img) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = img; } }
    window.addEventListener('resize', taille); taille();
    function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener('pointerdown', function (e) { down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { } var q = pt(e); ctx.beginPath(); ctx.moveTo(q.x, q.y); e.preventDefault(); });
    cv.addEventListener('pointermove', function (e) { if (!down) return; var q = pt(e); ctx.lineTo(q.x, q.y); ctx.stroke(); trace = true; e.preventDefault(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { cv.addEventListener(t, function () { down = false; }); });
    $('effacer').onclick = function () { ctx.clearRect(0, 0, cv.width, cv.height); trace = false; };
  }
  function dec() { var r = document.querySelector('input[name=dec]:checked'); return r ? r.value : ''; }
  Array.prototype.forEach.call(document.querySelectorAll('input[name=dec]'), function (r) { r.onchange = function () { var d = dec(); $('zmod').style.display = d === 'modifs' ? '' : 'none'; $('zref').style.display = d === 'refuse' ? '' : 'none'; $('zsig').style.display = d === 'refuse' ? 'none' : ''; }; });
  var ENVOI = false;
  $('signer').onclick = function () {
    if (ENVOI || !C) return;
    var d = dec(), m = [];
    if (!$('nom').value.trim()) m.push('votre nom');
    if (!d) m.push('votre décision');
    if (d && d !== 'refuse' && !$('lu').checked) m.push('la case « J\'ai lu le contrat »');
    if (d && d !== 'refuse' && !trace) m.push('votre signature');
    if (d === 'modifs' && !$('modifs').value.trim()) m.push('les modifications demandées');
    if (m.length) { $('manque').textContent = 'Il manque : ' + m.join(', ') + '.'; return; }
    $('manque').textContent = '';
    if (!confirm(d === 'refuse' ? 'Envoyer votre refus du contrat ?' : 'Signer le contrat et envoyer votre réponse ?\n\nUne seule réponse est possible par lien.')) return;
    var R = { type: 'jh-contrat-reponse', v: 1, enLigne: true, code: C.code, token: C.token, empreinte: EMP || ('fnv-' + fnv(String(C.contrat || ''))), empreinteRecue: C.empreinte, decision: d,
      modifs: d === 'modifs' ? $('modifs').value.trim() : '', raison: d === 'refuse' ? $('raison').value.trim() : '',
      signataire: { nom: $('nom').value.trim(), titre: $('titre').value.trim(), courriel: $('courriel').value.trim() }, signature: d === 'refuse' ? '' : cv.toDataURL('image/png'), signeLe: new Date().toISOString(),
      tz: (window.Intl && Intl.DateTimeFormat().resolvedOptions().timeZone) || '', ua: navigator.userAgent, lu: $('lu').checked };
    ENVOI = true; $('signer').disabled = true; $('signer').textContent = 'Envoi…';
    rpc('externe_repondre', { p_jeton: J, p_reponse: R }).then(function (o) {
      ENVOI = false;
      if (!o || !o.ok) { $('signer').disabled = false; $('signer').textContent = 'Signer et envoyer ma réponse'; if (o && (o.raison === 'repondu' || o.raison === 'expire' || o.raison === 'annule')) { refus(o); return; } $('manque').textContent = 'Réponse refusée par le serveur (' + esc((o && o.raison) || 'inconnu') + ').'; return; }
      fini(R, o);
    }, function (e) { ENVOI = false; $('signer').disabled = false; $('signer').textContent = 'Signer et envoyer ma réponse'; $('manque').textContent = 'Envoi impossible (' + (e.message || e) + ') : vérifiez votre connexion Internet et réessayez.'; });
  };
  function fini(R, o) {
    Array.prototype.forEach.call(document.querySelectorAll('#reponse input,#reponse textarea,#reponse button'), function (e) { if (e.id !== 'imprimer') e.disabled = true; });
    $('signer').style.display = 'none';
    if (R.signature) { $('sigprint').innerHTML = '<h2>Signature électronique</h2><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><img src="' + R.signature + '" alt="signature" style="max-height:80px;max-width:280px;border:1px solid #CBD5E1;border-radius:4px"><div style="font-size:12.5px"><b>' + esc(R.signataire.nom) + '</b>' + (R.signataire.titre ? ', ' + esc(R.signataire.titre) : '') + '<br>Signé le ' + esc(new Date(R.signeLe).toLocaleString('fr-CA')) + '<br>Empreinte du contrat : ' + esc(R.empreinte) + '</div></div>' + (R.modifs ? '<p><b>Modifications demandées</b><br>' + esc(R.modifs) + '</p>' : ''); $('sigprint').style.display = ''; }
    $('fin').style.display = '';
    $('fin').innerHTML = '<div class="okb"><b>Merci ! Votre ' + (R.decision === 'refuse' ? 'réponse' : 'signature') + ' est transmise à ' + esc(C.entreprise || 'l\'entreprise') + '</b> (reçue le ' + esc(new Date((o && o.repondu_le) || Date.now()).toLocaleString('fr-CA')) + '). Vous n\'avez rien à renvoyer.<br>Gardez une copie pour vos dossiers :</div><button class="bt pri" type="button" id="imprimer">Imprimer ou enregistrer en PDF</button>';
    $('imprimer').onclick = function () { window.print(); };
  }
  demarrer();
})();
</script>
</body>
</html>
